---
layout: default
---

<div class="pankuzu">
  <a href="{{ '/' | relative_url }}">ホーム</a>
 <span> > </span>
  <a href="{{ '/blog.html' | relative_url }}">株ブログ</a>
</div>

<h1>{{ page.title }}</h1>

<div class="date-nav">
  <p>{{ page.date | date: "%Y年%m月%d日" }}</p>
</div>

<hr>
{{ content }}
<hr>

<div class="post-nav">
  {% if page.previous %}
    <a href="{{ page.previous.url }}">← 前の記事</a>
  {% endif %}
  {% if page.next %}
    <a href="{{ page.next.url }}">次の記事 →</a>
  {% endif %}
</div>
